<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Envelope base -->
  <g filter="url(#shadow)">
    <!-- Main Mail Body -->
    <rect x="96" y="144" width="320" height="224" rx="28" fill="url(#primaryGrad)"/>

    <!-- Envelope Flap / Lines -->
    <path d="M 96 172 L 235 274 C 248 283 264 283 277 274 L 416 172" fill="none" stroke="#c7d2fe" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Tag badge at bottom right -->
    <circle cx="360" cy="350" r="64" fill="#0f172a"/>
    <circle cx="360" cy="350" r="54" fill="url(#accentGrad)"/>
    
    <!-- Checkmark inside badge -->
    <path d="M 334 350 L 352 368 L 388 332" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
